<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReminderGray</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <div class="toolbar">
      <span class="brand">ReminderGray</span>
      <span id="sync-state" aria-live="polite">尚未连接</span>
      <button id="settings-button" type="button">连接设置</button>
    </div>
    <form id="composer" class="glass composer">
      <input id="task-input" required maxlength="1000" placeholder="输入新的待办事项" autocomplete="off">
      <button class="primary" type="submit">添加</button>
      <div class="options">
        <label>重要 <input id="important" type="checkbox" role="switch"></label>
        <label>紧急 <input id="urgent" type="checkbox" role="switch"></label>
        <label>时间（可选） <input id="due-at" type="datetime-local"></label>
      </div>
    </form>
    <section id="matrix" class="matrix" aria-label="四象限待办"></section>
  </main>
  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>连接同步</h2>
      <p>输入电脑上同步服务使用的密钥。密钥只保存在当前浏览器。</p>
      <label>同步密钥 <input id="sync-key" type="password" autocomplete="off" required></label>
      <div class="dialog-actions">
        <button value="cancel" type="button" id="cancel-settings">取消</button>
        <button class="primary" value="save" type="submit">保存并同步</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
